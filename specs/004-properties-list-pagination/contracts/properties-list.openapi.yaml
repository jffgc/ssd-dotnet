openapi: 3.1.0
info:
  title: RealtorApi - listado de propiedades
  version: 1.0.0
  description: Contrato de lectura para el listado paginado de propiedades.
paths:
  /api/properties:
    get:
      operationId: listProperties
      summary: Listar propiedades de forma paginada
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página, comenzando en 1.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Cantidad de propiedades por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 6
      responses:
        "200":
          description: Página de propiedades y metadatos de navegación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertiesPage"
              example:
                items:
                  - id: 9c2fcbcb-f94a-4c70-b04f-b24488b89ad1
                    title: Casa en el centro
                    description: Casa familiar con patio.
                    address: Avenida Central 123
                    price: 285000
                    status: Available
                    bedroomCount: 3
                    bathroomCount: 2
                    areaSquareMeters: 148.5
                    imageUrl: http://localhost:5023/assets/properties/casa-centro.jpg
                page: 1
                pageSize: 6
                totalItems: 1
                totalPages: 1
                hasNext: false
                hasPrevious: false
        "400":
          description: Parámetros de paginación no válidos.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
components:
  schemas:
    PropertyListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - address
        - price
        - status
        - bedroomCount
        - bathroomCount
        - areaSquareMeters
        - imageUrl
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        address:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [Available, Rented, Maintenance]
        bedroomCount:
          type: integer
        bathroomCount:
          type: integer
        areaSquareMeters:
          type: number
        imageUrl:
          type: string
          format: uri
          pattern: "^https?://[^/]+/assets/properties/[^/]+$"
    PropertiesPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
        - hasNext
        - hasPrevious
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PropertyListItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          const: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
